name: Helpfix Fuel - Compilar APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android
        uses: android-actions/setup-android@v4
      - name: Instalar Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Preparar Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar APK debug
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Conferir versao do APK
        shell: bash
        run: |
          metadados="$("${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk)"
          printf '%s\n' "$metadados" | sed -n '1p'
          codigo=$(awk '/^[[:space:]]*versionCode / { print $2 }' app/build.gradle)
          versao=$(awk -F"'" '/^[[:space:]]*versionName / { print $2 }' app/build.gradle)
          [[ -n "$codigo" && -n "$versao" ]]
          [[ "$metadados" == *"name='br.com.helpfix.fuelsport' versionCode='$codigo' versionName='$versao'"* ]]
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: HelpfixFuel-PainelAutomotivo-3.3.4-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
