plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.helpfix.fuelsport'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.helpfix.fuelsport'
        minSdk 26
        targetSdk 35
        versionCode 335
        versionName '3.3.5'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
