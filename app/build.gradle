plugins { id 'com.android.application' version '8.7.3' }
android {
    namespace 'br.com.helpfix.fuelrace'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.helpfix.fuelrace'
        minSdk 23
        targetSdk 32
        versionCode 2
        versionName '1.1'
    }
    def signing = new Properties()
    file('../assinatura/local.properties').withInputStream { signing.load(it) }
    signingConfigs {
        pessoal {
            storeFile file('../assinatura/painel.p12')
            storePassword signing.getProperty('password')
            keyAlias 'painel'
            keyPassword signing.getProperty('password')
        }
    }
    buildTypes { release { signingConfig signingConfigs.pessoal } }
}
